name: transcendence

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: transcendence-backend
    environment:
      PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      POSTGRES_USER: ${POSTGRES_USER:-transcendence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transcendence_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-transcendence}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      VOICE_REQUIRED: ${VOICE_REQUIRED:-true}
    # No published port: the only way in is nginx over HTTPS (the subject requires HTTPS for every
    # connection to the backend). Containers still reach each other on the internal Docker network.
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: transcendence-frontend
    environment:
      # Empty: the website talks to the address it was opened from (nginx or the Vite proxy).
      VITE_API_URL: ${VITE_API_URL:-}
      # Where the Vite dev server forwards /api and /ws (only used inside Docker).
      API_PROXY_TARGET: http://backend:8080
      VITE_STUN_URLS: ${VITE_STUN_URLS:-}
    # No published port: the only way in is nginx over HTTPS (the subject requires HTTPS for every
    # connection to the backend). Containers still reach each other on the internal Docker network.
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: transcendence-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transcendence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transcendence_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-transcendence}
    # No published port: the only way in is nginx over HTTPS (the subject requires HTTPS for every
    # connection to the backend). Containers still reach each other on the internal Docker network.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # HTTPS entry point: https://localhost:8443 here, https://<this computer's IP>:8443 from other computers.
  # Ports above 1024, because rootless Docker (e.g. on the school computers) cannot use 80 and 443.
  nginx:
    image: nginx:alpine
    container_name: transcendence-nginx
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-8443}
    ports:
      - "${HTTPS_PORT:-8443}:443"
      - "${HTTP_PORT:-8000}:80"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  frontend_node_modules:
