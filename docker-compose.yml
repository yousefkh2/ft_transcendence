name: transcendence

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: transcendence-backend
    environment:
      PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      POSTGRES_USER: ${POSTGRES_USER:-transcendence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transcendence_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-transcendence}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      VOICE_REQUIRED: ${VOICE_REQUIRED:-true}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: transcendence-frontend
    environment:
      # Empty: the website talks to the address it was opened from (nginx or the Vite proxy).
      VITE_API_URL: ${VITE_API_URL:-}
      # Where the Vite dev server forwards /api and /ws when the site is opened on port 5173.
      API_PROXY_TARGET: http://backend:8080
      VITE_STUN_URLS: ${VITE_STUN_URLS:-}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: transcendence-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transcendence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transcendence_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-transcendence}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # HTTPS entry point: https://localhost here, https://<this computer's IP> from other computers.
  nginx:
    image: nginx:alpine
    container_name: transcendence-nginx
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  frontend_node_modules:
